services:

  app:
    container_name: jobportal-app
    build:
      context: .
      dockerfile: Dockerfile
    image: jobseekers-portal-app:latest
    env_file:
      - .env
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - laravel-storage:/var/www/html/storage
      - ./storage/certificate:/var/www/html/storage/certificate:ro
      - vite-build:/var/www/html/public/build

    networks:
      #- jobseekers-network
      - default
      - gateway

  # nginx:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.nginx
  #   image: jobseekers-portal-nginx:latest
  #   restart: unless-stopped
  #   depends_on:
  #     - app
  #   ports:
  #     - "443:443"
  #   volumes:
  #     - laravel-storage:/var/www/html/storage:ro
  #     - ./storage/certificate:/var/www/html/storage/certificate:ro
  #     - vite-build:/var/www/html/public/build:ro
  #     - /etc/ssl/uwezeshaji/vijanasmz_fullchain.crt:/etc/nginx/ssl/server.crt:ro
  #     - /etc/ssl/uwezeshaji/vijanasmz.go.tz.key:/etc/nginx/ssl/server.key:ro
  #   networks:
  #     - jobseekers-network
  #     - default
  #     - gateway

  db:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_DATABASE:-jobseekers}
      POSTGRES_USER: ${DB_USERNAME:-jobseekers}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-this-password}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - jobseekers-network

volumes:
  postgres-data:
  laravel-storage:
  vite-build:

networks:
  jobseekers-network:
    driver: bridge
    gateway:
    external: true
    name: vijana-gateway-network
