services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: jobseekers-portal-app:latest
    env_file:
      - .env
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - laravel-storage:/var/www/html/storage
      - ./storage/certificate:/var/www/html/storage/certificate:ro
      - vite-build:/var/www/html/public/build

    networks:
      - jobseekers-network
    #network_mode: host

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    image: vijana-nginx:latest
    restart: unless-stopped
    depends_on:
      - jobportal-app
      - admin-app
    ports:
      - "443:443"
    volumes:
      - /etc/ssl/uwezeshaji/vijanasmz_fullchain.crt:/etc/nginx/ssl/server.crt:ro
      - /etc/ssl/uwezeshaji/vijanasmz.go.tz.key:/etc/nginx/ssl/server.key:ro
      - jobportal-storage:/var/www/jobportal/storage:ro
      - jobportal-vite:/var/www/jobportal/public/build:ro
      - admin-storage:/var/www/admin/storage:ro
      - admin-vite:/var/www/admin/public/build:ro
    networks:
      - vijana-network

  db:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_DATABASE:-jobseekers}
      POSTGRES_USER: ${DB_USERNAME:-jobseekers}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-this-password}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - jobseekers-network

volumes:
  postgres-data:
  laravel-storage:
  vite-build:

networks:
  jobseekers-network:
    driver: bridge
