services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: jobseekers-portal-app:latest
    env_file:
      - .env
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - laravel-storage:/var/www/html/storage
      - vite-build:/var/www/html/public/build

    networks:
      - jobseekers-network
    #network_mode: host

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    image: jobseekers-portal-nginx:latest
    restart: unless-stopped

    depends_on:
      - app

    ports:
      - "9092:80"

    volumes:
      - laravel-storage:/var/www/html/storage:ro
      - vite-build:/var/www/html/public/build:ro

    networks:
      - jobseekers-network


  db:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_DATABASE:-jobseekers}
      POSTGRES_USER: ${DB_USERNAME:-jobseekers}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-this-password}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - jobseekers-network


volumes:
  postgres-data:
  laravel-storage:
  vite-build:


networks:
  jobseekers-network:
    driver: bridge
