server {
    # listen 443 ssl;
    listen 9092;
    # listen [::]:443 ssl;

    # server_name jobportal.vijanasmz.go.tz;
    server_name localhost;
    root /var/www/html/public;
    index index.php index.html;

    # ssl_certificate     /etc/nginx/ssl/server.crt;
    # ssl_certificate_key /etc/nginx/ssl/server.key;

    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;

    # If someone sends plain HTTP to port 443, redirect to HTTPS

    # error_page 497 301 =301 https://$http_host$request_uri; 

    charset utf-8;
    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;

        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_param HTTPS on;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|webp|woff|woff2|ttf)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
    }
}